---
# Tâches communes : clonage, build et lancement de l'application

- name: S'assurer que le répertoire parent existe
  file:
    path: "{{ app_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  tags: app

- name: Cloner le dépôt quiz-ansible depuis GitLab
  git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch | default('main') }}"
    force: yes
  tags: app

- name: Installer les dépendances npm
  community.general.npm:
    path: "{{ app_dir }}"
  tags: app

- name: Construire l'application (npm run build)
  shell: npm run build
  args:
    chdir: "{{ app_dir }}"
    creates: "{{ app_dir }}/dist"
  tags: app

- name: Installer serve globalement
  community.general.npm:
    name: serve
    global: yes
    state: present
  tags: app

- name: Arrêter une éventuelle instance serve précédente
  shell: "pkill -f 'serve -s {{ app_dir }}/dist' || true"
  changed_when: false
  tags: service

- name: Démarrer l'application avec serve (en arrière-plan)
  shell: |
    nohup serve -s {{ app_dir }}/dist -l {{ app_port }} > {{ app_dir }}/serve.log 2>&1 &
  args:
    chdir: "{{ app_dir }}"
  tags: service

- name: Afficher le statut du déploiement
  debug:
    msg:
      - "Application quiz-ansible déployée avec succès"
      - "Répertoire : {{ app_dir }}"
      - "Port : {{ app_port }}"
      - "URL : http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ app_port }}"
  tags: always
